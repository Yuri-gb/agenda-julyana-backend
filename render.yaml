services:
  - type: web
    name: agenda-julyana-whatsapp-baileys
    runtime: node
    region: oregon
    plan: starter
    rootDir: services/whatsapp-baileys
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        sync: false
      - key: AUTH_DIR
        value: /var/data/auth_info
      - key: LOG_LEVEL
        value: info
    disk:
      name: whatsapp-baileys-data
      mountPath: /var/data
      sizeGB: 1
