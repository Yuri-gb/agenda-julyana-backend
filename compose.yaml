services:
  postgres:
    image: postgres:17
    container_name: agenda-julyana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agenda_julyana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenda_julyana"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
