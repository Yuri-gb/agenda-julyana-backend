spring.application.name=agenda-julyana-backend

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.security.jwt.secret=${JWT_SECRET_BASE64}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

app.security.google.frontend-callback=${GOOGLE_FRONTEND_CALLBACK:http://localhost:5173/auth/callback}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.phone=${BOOTSTRAP_ADMIN_PHONE:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.test-payer-email=${MERCADOPAGO_TEST_PAYER_EMAIL:}

app.email.test-endpoint.enabled=${EMAIL_TEST_ENDPOINT_ENABLED:false}

app.gmail.client-id=${GMAIL_CLIENT_ID:}
app.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
app.gmail.redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:8080/api/integrations/google/gmail/callback}
app.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
app.gmail.from=${GMAIL_FROM:}
app.gmail.authorization.enabled=${GMAIL_AUTHORIZATION_ENABLED:false}
